<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --line: #d9e2ec;
      --accent: #0b6e4f;
      --accent-dark: #08543c;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
    }
    header h1 { margin: 0 0 8px; font-size: 18px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
    input {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      min-width: 220px;
    }
    input.small { min-width: 120px; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 9px 16px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: wait; }
    main { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; }
    aside {
      width: 380px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
      padding: 16px 20px;
    }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--bg); border-radius: 8px; padding: 10px; }
    .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .stat .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
    .stop { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
    .stop h3 { margin: 0 0 4px; font-size: 14px; }
    .stop p { margin: 2px 0; font-size: 13px; color: var(--muted); }
    .stop .badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      font-size: 12px;
      margin-right: 6px;
    }
    .message { color: var(--muted); font-size: 14px; }
    .error { color: var(--danger); font-size: 14px; white-space: pre-wrap; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 16px; }
    .meta a { color: var(--accent); }
    .stop-marker {
      background: var(--accent);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      line-height: 22px;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    @media (max-width: 800px) {
      main { flex-direction: column; }
      aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Fuel Route Planner</h1>
    <form id="plan-form">
      <label>Start
        <input id="start" name="start" placeholder="Los Angeles, CA" required>
      </label>
      <label>Finish
        <input id="finish" name="finish" placeholder="New York, NY" required>
      </label>
      <label>Starting fuel (gallons, optional)
        <input id="starting_fuel_gallons" name="starting_fuel_gallons" class="small" type="number" min="0" step="0.1" placeholder="full tank">
      </label>
      <button id="submit" type="submit">Plan route</button>
    </form>
  </header>
  <main>
    <div id="map"></div>
    <aside id="panel">
      <p class="message">Enter two locations inside the USA to see the route and the cheapest places to refuel.</p>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const API_URL = "{% url 'route-plan' %}";
    const map = L.map("map").setView([39.5, -98.35], 4);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const form = document.getElementById("plan-form");
    const panel = document.getElementById("panel");
    const submit = document.getElementById("submit");

    const money = (value) => "$" + Number(value).toFixed(2);
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const params = new URLSearchParams();
      params.set("start", form.start.value.trim());
      params.set("finish", form.finish.value.trim());
      if (form.starting_fuel_gallons.value) {
        params.set("starting_fuel_gallons", form.starting_fuel_gallons.value);
      }
      history.replaceState(null, "", "?" + params.toString());
      await loadPlan(params);
    });

    async function loadPlan(params) {
      submit.disabled = true;
      panel.innerHTML = '<p class="message">Planning the route...</p>';
      layer.clearLayers();
      const started = performance.now();
      try {
        const response = await fetch(API_URL + "?" + params.toString(), { headers: { "Accept": "application/json" } });
        const payload = await response.json();
        if (!response.ok) {
          const error = payload.error || {};
          let text = error.message || "The request failed.";
          if (error.details && typeof error.details === "object") {
            for (const [key, value] of Object.entries(error.details)) {
              if (value !== null && value !== undefined && key !== "field") {
                text += "\n" + key + ": " + (Array.isArray(value) ? value.join(" ") : value);
              }
            }
          }
          panel.innerHTML = '<p class="error">' + escapeHtml(text) + "</p>";
          return;
        }
        render(payload, Math.round(performance.now() - started));
      } catch (error) {
        panel.innerHTML = '<p class="error">Could not reach the API: ' + escapeHtml(error.message) + "</p>";
      } finally {
        submit.disabled = false;
      }
    }

    function render(plan, elapsedMs) {
      const stops = plan.fuel_stops;
      const summary = plan.summary;
      let html = '<div class="summary">' +
        stat("Total fuel cost", money(summary.total_fuel_cost)) +
        stat("Fuel stops", summary.fuel_stop_count) +
        stat("Distance", plan.route.distance_miles.toFixed(0) + " mi") +
        stat("Drive time", plan.route.duration_text) +
        stat("Gallons bought", summary.total_gallons_purchased.toFixed(1)) +
        stat("Gallons used", summary.total_gallons_consumed.toFixed(1)) +
        "</div>";
      if (!stops.length) {
        html += '<p class="message">No refuelling is needed. The vehicle starts with ' +
          plan.vehicle.starting_fuel_gallons.toFixed(1) + " gallons, enough for the whole trip.</p>";
      }
      stops.forEach((stop) => {
        html += '<div class="stop">' +
          "<h3><span class=\"badge\">" + stop.sequence + "</span>" + escapeHtml(stop.station.name) + "</h3>" +
          "<p>" + escapeHtml(stop.station.address) + ", " + escapeHtml(stop.station.city) + ", " + escapeHtml(stop.station.state) + "</p>" +
          "<p>Mile " + stop.distance_from_start_miles.toFixed(0) + " of the route, " + stop.distance_from_route_miles.toFixed(1) + " mi off route</p>" +
          "<p>Buy <strong>" + stop.gallons_purchased.toFixed(1) + " gal</strong> at $" + stop.price_per_gallon.toFixed(3) + "/gal for <strong>" + money(stop.cost) + "</strong></p>" +
          "<p>Tank on arrival " + stop.fuel_on_arrival_gallons.toFixed(1) + " gal, on departure " + stop.fuel_on_departure_gallons.toFixed(1) + " gal</p>" +
          "</div>";
      });
      html += '<p class="meta">' + escapeHtml(plan.start.label) + " to " + escapeHtml(plan.finish.label) +
        ". " + plan.stations_considered + " stations within " + plan.policy.max_detour_miles + " miles of the route were considered. " +
        "Routing API calls: " + plan.external_api_calls.routing + ", geocoding API calls: " + plan.external_api_calls.geocoding +
        (plan.cached ? " (served from cache)" : "") + ". Response in " + elapsedMs + " ms.</p>";
      panel.innerHTML = html;

      if (plan.route.geometry) {
        const line = L.geoJSON(plan.route.geometry, { style: { color: "#1d4ed8", weight: 4, opacity: 0.85 } }).addTo(layer);
        map.fitBounds(line.getBounds(), { padding: [30, 30] });
      }
      L.marker([plan.start.latitude, plan.start.longitude]).addTo(layer).bindPopup("Start: " + escapeHtml(plan.start.label));
      L.marker([plan.finish.latitude, plan.finish.longitude]).addTo(layer).bindPopup("Finish: " + escapeHtml(plan.finish.label));
      stops.forEach((stop) => {
        const icon = L.divIcon({ className: "stop-marker", html: String(stop.sequence), iconSize: [26, 26] });
        L.marker([stop.station.latitude, stop.station.longitude], { icon })
          .addTo(layer)
          .bindPopup("<strong>" + escapeHtml(stop.station.name) + "</strong><br>" +
            escapeHtml(stop.station.city) + ", " + escapeHtml(stop.station.state) + "<br>" +
            stop.gallons_purchased.toFixed(1) + " gal at $" + stop.price_per_gallon.toFixed(3) + " = " + money(stop.cost));
      });
    }

    function stat(label, value) {
      return '<div class="stat"><div class="label">' + label + '</div><div class="value">' + value + "</div></div>";
    }

    const initial = new URLSearchParams(window.location.search);
    if (initial.get("start") && initial.get("finish")) {
      form.start.value = initial.get("start");
      form.finish.value = initial.get("finish");
      if (initial.get("starting_fuel_gallons")) {
        form.starting_fuel_gallons.value = initial.get("starting_fuel_gallons");
      }
      loadPlan(initial);
    }
  </script>
</body>
</html>
